
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin:0;
            padding:0;
            box-sizing: border-box;
        }

        .container {
            width: 500px;
            height: 500px;   
            margin: 50px auto;
        }

        .top-left {
            background-color: red;
            width:250px;
            height:100px;
            float: left;
        }

        .top-right {
            background-color: green;
            width:250px;
            height:100px;
            float: left;
        }
        
        .inner-box {
            width: 100%;
            text-align: center;
            clear: both;
        }
    
        .main {
            width: 500px;
            height: 200px;
            background-color: blue;
        }

        </style>
</head>
<body>
    
    <div class="container">
        <div class="top-left"></div>
        <div class="top-right"></div>
        <div class="inner-box">
            <span>글자가운데정렬</span></div>
        <div class="main"></div>
    </div>
