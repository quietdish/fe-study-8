<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>q10_1</title>
</head>

<body>
    <form>
        <input type="text" id="loginId" placeholder="아이디"><br>
        <input type="password" id="loginPw" placeholder="비밀번호"><br>
        <button id="btnLogin" onclick="tryLogin()">로그인 시도</button><br>
    </form>

    <script>

        const input_id = document.getElementById('loginId');
        const input_pw = document.getElementById('loginPw');


        /*
        *로그인 버튼을 누르면.
        > 아이디와 비밀번호에 있는 입력된 텍스트를 없애기
    
        *아이디 입력칸에서 키보드 입력 시,
        무슨 키가 눌렸는지 확인 해보고 엔터가 눌리면 비밀번호 입력 칸으로 이동
    
        *비밀번호 입력칸에서 키보드 입력 시,
        엔터가 눌리면 로그인 버튼을 누른것과 동일한 기능을 수행

        
        +Option 1
        위 입력값들을 form 태그로 감싸고, 동일하게 작동하도록 수정하세요.

        */
        function tryLogin() {
            input_id.value = '';
            input_pw.value = '';
        }

        input_id.addEventListener('keydown', (event) => {
            //event 키보드 이벤트 정보

            if (event.key == 'Enter') {  //엔터입력 여부
                event.preventDefault(); //기본이벤트 발생 중지
                input_pw.focus();
                //submit 발생
            }
        })

        input_pw.addEventListener('keydown', (event) => {

            //비밀번호 칸에서 엔터를 눌렀을때
            if (event.key == 'Enter') {
                //로그인 버튼 눌렀을때와 동일한 기능

                //1) 동일한 코드 수행
                //input_id.value = '';
                //input_pw.value = '';

                //2) 실제 버튼 이벤트 발생
                //document.getElementById('btnLogin').click();

                //3) 동일한 함수 그대로 호출
                event.preventDefault();
                tryLogin();
            }
        })


    </script>
</body>

</html>
