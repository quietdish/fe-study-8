<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js 9_2</title>

    <style>
        /* 필요시 작성 */

        /* .bg-gray {
            background-color: gray;
        }

        #p1.red-text {
            color: red;
        } */

        .red {
            color: red;
        }

        .bg-gray {
            background-color: gray;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="main"> <!-- mainDiv -->
            <p id="p1">p1 텍스트</p> <!-- p1Tag-->
            <p id="p2">p2 텍스트</p> <!-- p2Tag-->
        </div>
    </div>

    <button onclick="changeMain()">main 배경색 gray로 변경</button>
    <button onclick="changeP1()">p1 글자색 red로 변경</button>
    <button onclick="changeP2()">"p2 텍스트"를 "p2 글자" 로 변경</button>

    <button onclick="restoreMain()">main 배경색 white로 복구</button>
    <button onclick="restoreP1()">p1 글자색 black으로 복구</button>


    <script>

        let bgFlag = false;
        /* 코드 작성 부분 */

        // const mainDiv = document.getElementById('main');
        // const p1Tag = document.getElementById('p1');
        // const p2Tag = document.getElementById('p2');


        function changeMain() {
            document.getElementById('main').style.backgroundColor = 'gray';
        }

        function changeP1() {
            //document.getElementById('p1').classList.add('red');
            document.getElementById('p1').classList.toggle('red');
        }


        let index = 1;
        let textArr = ['p2 텍스트', 'p2 하나', 'p2 둘', 'p2 셋', 'p2 넷'];
        // textARr[index];

        function changeP2() {
            const p2 = document.getElementById('p2');
            p2.textContent = textArr[index];
            index = (index + 1) % textArr.length; // 0, 1, 2, 3, 4 순서로 계속 순환함
        }



        function changeP2() {
            //document.getElementById('p2').textContent = 'p2 글자';

            const p2 = document.getElementById('p2');

            if (p2.textContent == 'p2 텍스트') {
                p2.textContent = 'p2 하나';
            } else if (p2.textContent == 'p2 하나') {
                p2.textContent = 'p2 둘';
            } else if (p2.textContent == 'p2 둘') {
                p2.textContent = 'p2 셋';
            } else if (p2.textContent == 'p2 셋') {
                p2.textContent = 'p2 넷';
            } else {
                (p2.textContent = 'p2 텍스트');
            }

        }


        function restoreMain() {
            document.getElementById('main').style.removeProperty('background-color');
        }

        function restoreP1() {
            document.getElementById('p1').classList.remove('red');
        }

    </script>
</body>

</html>
