<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
                display: inline-block;
                width: 500px;
                height: 300px;
                border: 5px solid black;
                margin: 50px;
            }

        .red-box {
            background-color: red;
            width: 100px;
            height: 100px;        
        }

        .green-box {
            background-color: green;
            position: fixed;
            left: 100px;
            top: 150px;            
            width: 100px;
            height: 100px;
            z-index: 5;        
        }

        .yellow-box {
            background-color: yellow;
            width: 100px;
            height: 100px;
        }

        .lightgray-box {
            background-color: lightgray;
            height: 55px;
        }
        
    </style>
</head>

<body>
    
    <div class="box lightgray-box">
        <h3>배경색이 lightgray</h3>
        <h3>h3글자</h3>        
    </div>    

    <div class="container">
        <div class="box red-box">A</div>
        <div class="box green-box">B</div>
        <div class="box yellow-box">C</div>
</body>

</html>
