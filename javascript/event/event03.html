<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            width: 500px;
            height: 500px;
            background-color: antiquewhite;
        }

        .box:hover {
            background-color: brown;
        }
    </style>
</head>

<body>

    <button id="btn1" onclick="btn_click()">버튼1</button>

    <div class="box"></div>

    <script>

        const btn_click = () => {
            console.log('btn 버튼1 눌림');
        }

        const divBox = document.getElementsByClassName('box')[0];   ///[0]써야함...
        divBox.onmouseover = () => {
            console.log("마우스가 올라옴");
        }

        divBox.addEventListener('mouseout', () => {
            console.log("마우스가 영역 밖으로 나감");
        })

        divBox.addEventListener('mousemove', () => {
            console.log("마우스가 움직임");
        })

        divBox.addEventListener('wheel', () => {
            console.log("마우스 휠이 움직임");
        })


        // function func()
        // function func(event)

        divBox.addEventListener('click', (event) => {
            /* console.log("dsdfsdf"); */
            //매개변수 event -> 마우스 이벤트 정보가 담겨있는 객체가 전달됨
            console.log(event);     ///콘솔 PointerEvent {isTrusted: true, pointerId: 1, width: 1, height: 1, pressure: 0, …}isTrusted: truealtKey: falsealtitudeAngle: 1.5707963267948966azimuthAngle: 0bubbles: truebutton: 0buttons: 0cancelBubble: falsecancelable: trueclientX: 67clientY: 315composed: truectrlKey: falsecurrentTarget: nulldefaultPrevented: falsedetail: 1eventPhase: 0fromElement: nullheight: 1isPrimary: falselayerX: 67layerY: 315metaKey: falsemovementX: 0movementY: 0offsetX: 59offsetY: 281pageX: 67pageY: 315persistentDeviceId: 0pointerId: 1pointerType: "mouse"pressure: 0relatedTarget: nullreturnValue: truescreenX: 75screenY: 467shiftKey: falsesourceCapabilities: InputDeviceCapabilities {firesTouchEvents: false}srcElement: div.boxtangentialPressure: 0target: div.boxtiltX: 0tiltY: 0timeStamp: 49299.60000002384toElement: nulltwist: 0type: "click"view: Window {window: Window, self: Window, document: document, name: '', location: Location, …}which: 1width: 1x: 67y: 315[[Prototype]]: PointerEvent

            console.log(event.clientX);
            console.log(event.clientY);
            console.log(event.pageX);
            console.log(event.pageY);
            console.log(event.screenX);
            console.log(event.screenY);

        })


    </script>

</body>

</html>
